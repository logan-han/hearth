coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 1%
    patch:
      default:
        target: 80%
        threshold: 5%

comment:
  layout: "reach, diff, files"
  require_changes: true

ignore:
  - "tests/**"
  - "drizzle/**"
  - "scripts/**"
  - "app/**/page.tsx"
  - "app/**/layout.tsx"
