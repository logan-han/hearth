version: 2
updates:
  # One pull request a week for the routine bumps, so a Next or AI SDK patch
  # is proposed rather than waiting for someone to notice. Majors still come
  # one at a time, since each is its own migration.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
